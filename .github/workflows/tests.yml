# Rashed-Step pre_11.E-08-18-2026-start
# Runs the pytest suite (158 tests as of Step pre_11.C/D) on every push
# and pull request against main/improved-simulator-2025, across the two
# Python versions this project has actually been developed/tested under
# (3.10 in the dev sandbox, 3.12 locally - see __pycache__ filenames).
# Deliberately minimal for a first pass: no lint, no coverage gate, just
# "does the test suite still pass" - see Project details/Step pre_11.txt
# pre_11.E for why this was added and what was intentionally left out.
name: tests

on:
  push:
    branches: [main, improved-simulator-2025]
  pull_request:
    branches: [main, improved-simulator-2025]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest test/ -q
# Rashed-Step pre_11.E-08-18-2026-end
